name: Generate Keystore
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-release.jks \
            -alias mykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=MyApp, OU=Dev, O=MyOrg, L=City, S=State, C=US"
      
      - name: Convert to Base64
        run: |
          base64 -w 0 my-release.jks > keystore_base64.txt
          echo "=== YOUR KEYSTORE BASE64 (COPY THIS) ==="
          cat keystore_base64.txt
